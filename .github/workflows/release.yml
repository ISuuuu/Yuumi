name: Release Yuumi

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动指定版本号 (例如: v0.5.0)'
        required: true
        type: string

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ steps.get-version.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Yuumi ${tagName}`,
              body: '## What\'s Changed\n\n请查看下方 Changelog',
              tag_name: tagName,
              draft: true,
              prerelease: false
            });
            return data.id

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      # 静态链接 MSVC CRT：便携版/安装包经常在未安装 VC++ 运行库的干净系统（如 Windows 沙箱）上直接运行，
      # 动态 CRT 会因缺少 VCRUNTIME140.dll 而无法启动。
      RUSTFLAGS: "-C linker=lld-link -C target-feature=+crt-static"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Cache NSIS
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: ${{ runner.os }}-nsis-v1

      - name: Install NSIS
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "NSIS cache miss. Installing via Chocolatey..."
          choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $defaultNsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $defaultNsisPath) {
            Write-Host "Found NSIS at: $defaultNsisPath. Adding to PATH..."
            echo "$defaultNsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$defaultNsisPath;" + $env:PATH
          } else {
            Write-Error "NSIS not found at $defaultNsisPath!"
            exit 1
          }

          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisExe) {
            & "$nsisExe" -VERSION
          } else {
            Write-Error "makensis.exe not found!"
            exit 1
          }

      - name: Update version in Cargo manifests
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}" -replace '^v', ''
          (Get-Content crates/yuumi-gpui/Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$VERSION`"" | Set-Content crates/yuumi-gpui/Cargo.toml
          (Get-Content crates/yuumi-core/Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$VERSION`"" | Set-Content crates/yuumi-core/Cargo.toml
          Write-Host "Updated Cargo package versions to $VERSION"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          NOTES="$(bash .github/scripts/generate-release-notes.sh "${{ needs.create-release.outputs.version }}")"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: cargo build --release -p yuumi-gpui

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}" -replace '^v', ''
          $BASE_VERSION = ($VERSION -split '-')[0]
          $VI_VERSION = "$BASE_VERSION.0"
          Write-Host "Building NSIS installer for version $VERSION (VI_VERSION: $VI_VERSION)..."
          makensis /DVERSION=$VERSION /DVI_VERSION=$VI_VERSION .github/nsis/installer.nsi
          if (-not (Test-Path "Yuumi_${VERSION}_x64-setup.exe")) {
            Write-Error "Failed to produce Yuumi_${VERSION}_x64-setup.exe"
            exit 1
          }
          Write-Host "NSIS installer built successfully."

      - name: Pack portable zip
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}" -replace '^v', ''
          $ROOT_NAME = "Yuumi-portable"
          $PACKAGE_DIR = "$env:RUNNER_TEMP/Yuumi-portable-package"
          $PORTABLE_DIR = Join-Path $PACKAGE_DIR $ROOT_NAME
          $ZIP_NAME = "Yuumi_v${VERSION}_portable.zip"

          New-Item -ItemType Directory -Force -Path $PORTABLE_DIR
          Copy-Item "target/release/yuumi.exe" "$PORTABLE_DIR/"

          New-Item -ItemType File -Force -Path "$PORTABLE_DIR/portable.flag" | Out-Null
          New-Item -ItemType Directory -Force -Path "$PORTABLE_DIR/data" | Out-Null
          New-Item -ItemType File -Force -Path "$PORTABLE_DIR/data/.keep" | Out-Null

          7z a -tzip -mx=7 $ZIP_NAME "$PORTABLE_DIR"
          Write-Host "Portable zip created: $ZIP_NAME"

      - name: Sign release artifacts
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}" -replace '^v', ''
          $SETUP_EXE = "Yuumi_${VERSION}_x64-setup.exe"
          $PORTABLE_ZIP = "Yuumi_v${VERSION}_portable.zip"

          cargo run --manifest-path .github/scripts/minisign-sign/Cargo.toml -- $SETUP_EXE "$SETUP_EXE.sig"
          cargo run --manifest-path .github/scripts/minisign-sign/Cargo.toml -- $PORTABLE_ZIP "$PORTABLE_ZIP.sig"

          Get-ChildItem -Path "*.sig" | ForEach-Object { Write-Host "Signed artifact: $($_.Name)" }

      - name: Generate latest.json for updater
        shell: pwsh
        env:
          CHANGELOG_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}" -replace '^v', ''
          $TAG = "${{ needs.create-release.outputs.version }}"
          $SETUP_EXE = "Yuumi_${VERSION}_x64-setup.exe"
          $PORTABLE_ZIP = "Yuumi_v${VERSION}_portable.zip"

          $SIGNATURE = (Get-Content "$SETUP_EXE.sig" -Raw).Trim()
          $PORTABLE_SIGNATURE = (Get-Content "$PORTABLE_ZIP.sig" -Raw).Trim()
          $PUB_DATE = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $CHANGELOG = if ($env:CHANGELOG_NOTES) { $env:CHANGELOG_NOTES.Trim() } else { "" }

          $SETUP_URL = "https://github.com/ISuuuu/Yuumi/releases/download/${TAG}/${SETUP_EXE}"
          $PORTABLE_URL = "https://github.com/ISuuuu/Yuumi/releases/download/${TAG}/${PORTABLE_ZIP}"

          $LATEST_JSON = @{
            version = $VERSION
            notes = $CHANGELOG
            pub_date = $PUB_DATE
            platforms = @{
              "windows-x86_64" = @{
                signature = $SIGNATURE
                url = $SETUP_URL
              }
              "windows-x86_64-portable" = @{
                signature = $PORTABLE_SIGNATURE
                url = $PORTABLE_URL
              }
            }
          }

          $LATEST_JSON | ConvertTo-Json -Depth 10 | Set-Content "latest.json" -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content "latest.json" | Write-Host

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuumi-windows-installer
          path: |
            ./Yuumi_*_x64-setup.exe
            ./Yuumi_*_x64-setup.exe.sig
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuumi-windows-portable
          path: |
            ./Yuumi_v*_portable.zip
            ./Yuumi_v*_portable.zip.sig
          retention-days: 7

      - name: Upload latest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuumi-updater
          path: ./latest.json
          retention-days: 7

  publish-release:
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changelog
        id: changelog
        run: |
          NOTES="$(bash .github/scripts/generate-release-notes.sh "${{ needs.create-release.outputs.version }}")"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: yuumi-windows-installer
          path: ./artifacts/installer

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: yuumi-windows-portable
          path: ./artifacts/portable

      - name: Download updater artifact (latest.json)
        uses: actions/download-artifact@v4
        with:
          name: yuumi-updater
          path: ./artifacts/updater

      - name: List artifacts
        run: ls -la ./artifacts/installer ./artifacts/portable ./artifacts/updater

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          releaseId: ${{ needs.create-release.outputs.release_id }}
          body: "${{ steps.changelog.outputs.notes }}"
          artifacts: "./artifacts/installer/*,./artifacts/portable/*,./artifacts/updater/latest.json"
