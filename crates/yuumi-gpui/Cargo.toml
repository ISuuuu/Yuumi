[package]
name = "yuumi-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
yuumi-core = { path = "../yuumi-core" }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tray-icon = "0.19"
rfd = "0.15"
image = "0.25"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
