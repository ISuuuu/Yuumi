[package]
name = "yuumi-gpui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# 开发构建默认 opt-level=0 时，gpui 的布局/绘制（taffy layout + paint）极慢：
# 对局信息页一次整页重绘要 330ms，拖动窗口起始那一次重绘就是肉眼可见的卡顿。
# 这里让依赖（gpui/taffy 等）以 opt-level=2 编译，本 crate 保持 0，增量编译仍只需 ~10s。
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"

[dependencies]
yuumi-core = { path = "../yuumi-core" }
gpui = "0.2.2"
rustls = { version = "0.23", features = ["ring"] }
log = { version = "0.4", features = ["std"] }
reqwest = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tray-icon = "0.19"
rfd = "0.15"
dirs = "6"
sysinfo = "0.33"
image = "0.25"
smallvec = "1"

[target.'cfg(windows)'.dependencies]
xcap = "=0.0.14"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

# 本地打过补丁的 gpui 0.2.2（crates.io 上无更新版本）：
# vendor/gpui/src/window.rs 的 bounds_changed 只在尺寸/缩放/显示器变化时重绘，
# 避免拖动窗口时每次 WM_MOVE 都全量重绘。
[patch.crates-io]
gpui = { path = "../../vendor/gpui" }
